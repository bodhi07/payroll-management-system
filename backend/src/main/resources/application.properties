# Server Port Configuration
server.port=8080

# Application Name
spring.application.name=payroll-management-system

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/payroll_management_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security / JWT Secret Configuration (256-bit secret key)
jwt.secret=c2VjcmV0S2V5Rm9yUGF5cm9sbE1hbmFnZW1lbnRTeXN0ZW1FbnRlcnByaXNlMjAyNkpXVDMyQnl0ZXM=
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000


# OpenAPI / Swagger Documentation Setup
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
